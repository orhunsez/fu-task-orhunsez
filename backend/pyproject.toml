[project]
name = "fu-task-backend"
version = "0.1.0"
description = "Saha bakım ekibi görev takip API'si (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
    "tzdata>=2026.6",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# Paket olarak kurulmaz; sadece uygulama.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: temel hatalar, I: import sırası, B: yaygın bug kalıpları, UP: modern Python söz dizimi
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
